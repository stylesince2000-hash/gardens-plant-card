<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plant Card">
<meta name="theme-color" content="#4a2e17">
<title>GARDENS Plant Card</title>
<style>
  :root{
    --ink:#4a2e17; --bg:#f3efe6; --line:#d9cfbf;
    --accent:#8a6d4f; --card:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:#2c2016;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
    -webkit-text-size-adjust:100%;
    /* lock horizontal movement — only vertical scroll allowed */
    max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;}
  html,body{touch-action:pan-y;}
  input[type=range]{touch-action:none;}   /* keep sliders draggable */
  body{padding:12px 12px calc(28px + env(safe-area-inset-bottom)); max-width:560px;margin:0 auto;}
  h1{font-size:17px;margin:6px 2px 12px;font-weight:600;letter-spacing:.02em;}
  h1 small{display:block;font-weight:400;color:#8a7c6a;font-size:12px;margin-top:2px;}

  .stage{background:var(--card);border-radius:14px;overflow:hidden;
    box-shadow:0 1px 4px rgba(0,0,0,.12);margin-bottom:14px;position:relative;}
  #canvas{display:block;width:100%;height:auto;}
  .empty{padding:48px 20px;text-align:center;color:#9a8b78;}
  .empty svg{width:52px;height:52px;opacity:.5;margin-bottom:10px;}
  /* center guide overlay (not drawn onto the exported JPEG) */
  #guide{position:absolute;top:0;bottom:0;width:0;transform:translateX(-50%);
    border-left:2px dashed rgba(120,100,80,.5);opacity:0;transition:opacity .12s;pointer-events:none;}
  #guide.on{opacity:1;}
  #guide.centered{border-left:2px solid #2ea043;box-shadow:0 0 0 1px rgba(46,160,67,.25);}
  #cbadge{position:absolute;top:8px;left:50%;transform:translateX(-50%) scale(.9);
    background:#2ea043;color:#fff;font-size:12px;font-weight:800;letter-spacing:.08em;
    padding:4px 12px;border-radius:20px;opacity:0;transition:opacity .12s,transform .12s;
    pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.2);}
  #cbadge.on{opacity:1;transform:translateX(-50%) scale(1);}

  .card{background:var(--card);border-radius:14px;padding:14px 14px 4px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:8px;}
  label{display:block;font-size:12px;color:#8a7c6a;margin-bottom:6px;font-weight:600;letter-spacing:.02em;}
  input[type=text]{width:100%;font-size:17px;padding:11px 12px;border:1px solid var(--line);
    border-radius:10px;background:#fcfbf9;color:#2c2016;font-family:inherit;}
  input[type=text]:focus{outline:none;border-color:var(--accent);}

  details{margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;}
  summary{list-style:none;cursor:pointer;padding:13px 14px;font-size:14px;font-weight:600;color:#5b4a37;}
  summary::-webkit-details-marker{display:none;}
  summary::after{content:"▸";float:right;color:#b8a58f;transition:transform .15s;}
  details[open] summary::after{transform:rotate(90deg);}
  .adj{padding:2px 14px 12px;}
  .row{display:flex;align-items:center;gap:10px;margin:12px 0;}
  .row label{flex:0 0 96px;margin:0;font-weight:500;color:#6b5a45;}
  .row input[type=range]{flex:1;accent-color:var(--accent);}
  .row select{flex:1;font-size:15px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fcfbf9;}
  .row input[type=color]{width:42px;height:34px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px;}
  .val{flex:0 0 40px;text-align:right;font-variant-numeric:tabular-nums;color:#9a8b78;font-size:13px;}

  .btns{display:flex;gap:10px;flex-wrap:wrap;}
  button{flex:1;min-width:130px;font-family:inherit;font-size:16px;font-weight:600;
    padding:14px;border-radius:12px;border:none;cursor:pointer;}
  .primary{background:var(--ink);color:#fff;}
  .primary:active{background:#3a2411;}
  .ghost{background:#efe8dc;color:#5b4a37;}
  .ghost:active{background:#e5dccc;}
  .hint{font-size:12px;color:#9a8b78;margin:10px 2px 0;line-height:1.6;}
  input[type=file]{display:none;}
</style>
</head>
<body>
<h1>GARDENS Plant Card<small>植物名を入れてJPEG保存</small></h1>

<div class="stage" id="stage">
  <canvas id="canvas"></canvas>
  <div id="guide"></div>
  <div id="cbadge">● 中央</div>
  <div class="empty" id="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    <div>下の「テンプレート画像を選ぶ」から<br>GARDENSカード画像を選んでください</div>
  </div>
</div>

<div class="card">
  <div class="field">
    <label>学名（大きく表示）</label>
    <input type="text" id="name" placeholder="Ficus benghalensis" autocapitalize="words" autocomplete="off">
  </div>
  <div class="field">
    <label>読み仮名（明朝体で表示）</label>
    <input type="text" id="reading" placeholder="フィカス・ベンガレンシス" autocomplete="off">
  </div>
</div>

<div class="card">
  <label style="margin-bottom:2px">位置調整（学名・読みを個別に上下）</label>
  <div class="row"><label style="flex:0 0 112px">学名の縦位置</label><input type="range" id="posY" min="40" max="92" value="77"><span class="val" id="posYV"></span></div>
  <div class="row"><label style="flex:0 0 112px">読みの縦位置</label><input type="range" id="posY2" min="55" max="98" value="87"><span class="val" id="posY2V"></span></div>
  <div class="row"><label style="flex:0 0 112px">横位置</label><input type="range" id="posX" min="-15" max="15" value="0"><span class="val" id="posXV"></span></div>
</div>

<details>
  <summary>フォント・サイズ・色を調整</summary>
  <div class="adj">
    <div class="row"><label>フォント</label>
      <select id="font">
        <option value="'Hoefler Text',serif">Hoefler Text（上品）</option>
        <option value="Didot,'Bodoni 72',serif">Didot（細めエレガント）</option>
        <option value="Georgia,serif">Georgia</option>
        <option value="'Times New Roman',serif">Times</option>
        <option value="'Snell Roundhand',cursive">筆記体</option>
      </select>
    </div>
    <div class="row"><label>学名サイズ</label><input type="range" id="nameSize" min="30" max="120" value="72"><span class="val" id="nameSizeV"></span></div>
    <div class="row"><label>字幅（細長さ）</label><input type="range" id="width" min="55" max="115" value="82"><span class="val" id="widthV"></span></div>
    <div class="row"><label>読みサイズ</label><input type="range" id="readSize" min="14" max="60" value="30"><span class="val" id="readSizeV"></span></div>
    <div class="row"><label>自前の罫線</label><input type="range" id="rule" min="0" max="2" value="0" step="1"><span class="val" id="ruleV"></span></div>
    <div class="row"><label>インク色</label><input type="color" id="ink" value="#4a2e17"><button class="ghost" style="flex:0 0 auto;min-width:0;padding:8px 12px;font-size:13px" id="autoInk">自動</button></div>
    <div class="row"><label>「Plant Name」を隠す</label><input type="range" id="cover" min="0" max="22" value="0"><span class="val" id="coverV"></span></div>
    <div class="row"><label>隠す色</label><input type="color" id="coverCol" value="#f7f5f0"><button class="ghost" style="flex:0 0 auto;min-width:0;padding:8px 12px;font-size:13px" id="autoCover">自動</button></div>
  </div>
</details>

<div class="btns">
  <button class="ghost" id="pick">テンプレート画像を選ぶ</button>
  <button class="primary" id="save">JPEG保存</button>
</div>
<input type="file" id="file" accept="image/*">
<div class="hint">初回だけテンプレート画像を選ぶと端末に保存され、次からはオフラインで使えます。保存後は共有シートの「画像を保存」でカメラロールに入ります。</div>

<script>
const $ = id => document.getElementById(id);
const cv = $('canvas'), ctx = cv.getContext('2d');
let img = null;                // HTMLImageElement of template
const STORE = 'gardensPlantCard_v1';

// ---- persisted settings ----
const controls = ['name','reading','font','nameSize','width','readSize','posY','posY2','posX','cover','rule','ink','coverCol'];
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE)||'{}');
    controls.forEach(k=>{ if(s[k]!=null && $(k)) $(k).value = s[k]; });
    if(s.template) setTemplate(s.template, false);
  }catch(e){}
}
function saveState(){
  const s = {};
  controls.forEach(k=>{ s[k] = $(k).value; });
  if(img && img._src) s.template = img._src;
  try{ localStorage.setItem(STORE, JSON.stringify(s)); }
  catch(e){ /* quota: keep template only */
    try{ localStorage.setItem(STORE, JSON.stringify({template:s.template})); }catch(_){}
  }
}

// ---- template handling ----
let _px = null;                 // cached pixel data of template
function setTemplate(dataUrl, isNew){
  const im = new Image();
  im.onload = ()=>{ im._src = dataUrl; img = im; _px = null;
    $('empty').style.display='none'; cv.style.display='block';
    if(isNew){ autoInkColor(); autoCoverColor(); }   // match card colors automatically
    render(); if(isNew) saveState(); };
  im.src = dataUrl;
}
$('pick').onclick = ()=> $('file').click();
$('file').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ setTemplate(r.result, true); };
  r.readAsDataURL(f);
};

// read the whole template into a pixel buffer (cached)
function pixels(){
  if(_px) return _px;
  if(!img) return null;
  const t = document.createElement('canvas'); t.width=img.naturalWidth; t.height=img.naturalHeight;
  const tc = t.getContext('2d'); tc.drawImage(img,0,0);
  try{ _px = tc.getImageData(0,0,img.naturalWidth,img.naturalHeight); }catch(_){ _px=null; }
  return _px;
}
const hx = x => ('0'+Math.max(0,Math.min(255,Math.round(x))).toString(16)).slice(-2);

// sample the card's ink color = average of the darkest sampled pixels
function autoInkColor(){
  const im = pixels(); if(!im) return;
  const {data,width:W,height:H} = im;
  const cols=60, rows=Math.round(60*H/W), list=[];
  for(let gy=0; gy<rows; gy++) for(let gx=0; gx<cols; gx++){
    const px=Math.floor((gx+0.5)/cols*W), py=Math.floor((gy+0.5)/rows*H);
    const i=(py*W+px)*4;
    list.push([data[i]+data[i+1]+data[i+2], data[i],data[i+1],data[i+2]]);
  }
  list.sort((a,b)=>a[0]-b[0]);
  const top=list.slice(0,20); let r=0,g=0,b=0;
  top.forEach(p=>{r+=p[1];g+=p[2];b+=p[3];});
  const n=top.length; $('ink').value='#'+hx(r/n)+hx(g/n)+hx(b/n);
}
$('autoInk').onclick = ()=>{ autoInkColor(); render(); saveState(); };

// sample background color from blank margins → "隠す色"
function autoCoverColor(){
  const im = pixels(); if(!im) return;
  const {data,width:W,height:H} = im;
  const pts = [[0.14,0.5],[0.86,0.5],[0.5,0.82],[0.5,0.9],[0.14,0.35]];
  let r=0,g=0,b=0,n=0;
  for(const [px,py] of pts){
    const i=(Math.floor(H*py)*W+Math.floor(W*px))*4;
    r+=data[i];g+=data[i+1];b+=data[i+2];n++;
  }
  if(n) $('coverCol').value = '#'+hx(r/n)+hx(g/n)+hx(b/n);
}
$('autoCover').onclick = ()=>{ autoCoverColor(); render(); saveState(); };

// ---- render ----
function render(){
  if(!img) return;
  const W = img.naturalWidth, H = img.naturalHeight;
  cv.width = W; cv.height = H;
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(img,0,0,W,H);

  const cx = W*0.5 + W*(parseFloat($('posX').value)/100);
  const yc = H*(parseFloat($('posY').value)/100);
  const ink = $('ink').value;
  const nameSize = W*(parseFloat($('nameSize').value)/1000);
  const readSize = W*(parseFloat($('readSize').value)/1000);
  const font = $('font').value;

  // cover printed "Plant Name"
  const coverH = H*(parseFloat($('cover').value)/100);
  if(coverH>0){
    ctx.fillStyle = $('coverCol').value;
    ctx.fillRect(W*0.12, yc-coverH*0.62, W*0.76, coverH);
  }

  ctx.textAlign='center'; ctx.fillStyle=ink;

  // scientific name (with horizontal squeeze for a slender look)
  const nm = $('name').value.trim();
  const wScale = parseFloat($('width').value)/100;
  if(nm){
    ctx.textBaseline='alphabetic';
    ctx.font = nameSize+"px "+font;
    ctx.save();
    ctx.translate(cx,0); ctx.scale(wScale,1); ctx.translate(-cx,0);
    ctx.fillText(nm, cx, yc);
    ctx.restore();
  }

  // rule (diamond divider)
  const ruleMode = parseInt($('rule').value,10);
  const ruleY = yc + nameSize*0.55;
  if(ruleMode>0){
    const half = W* (ruleMode===2?0.40:0.34);
    ctx.strokeStyle=ink; ctx.lineWidth=Math.max(1.2, W*0.0016);
    const gap = W*0.02;
    ctx.beginPath();
    ctx.moveTo(cx-half, ruleY); ctx.lineTo(cx-gap, ruleY);
    ctx.moveTo(cx+gap, ruleY);  ctx.lineTo(cx+half, ruleY);
    ctx.stroke();
    // center diamond
    const d = W*0.011;
    ctx.beginPath();
    ctx.moveTo(cx, ruleY-d); ctx.lineTo(cx+d, ruleY);
    ctx.lineTo(cx, ruleY+d); ctx.lineTo(cx-d, ruleY);
    ctx.closePath(); ctx.fillStyle=ink; ctx.fill();
  }

  // reading (mincho) — independent height so it can sit below the card's own divider
  const rd = $('reading').value.trim();
  if(rd){
    const ry = H*(parseFloat($('posY2').value)/100);
    ctx.textBaseline='middle'; ctx.fillStyle=ink;
    ctx.font = readSize+"px 'Hiragino Mincho ProN','YuMincho',serif";
    ctx.fillText(rd, cx, ry);
  }
}

// ---- live updates ----
function bind(id){
  const el=$(id);
  const ev = (el.type==='range'||el.type==='color'||el.tagName==='SELECT')?'input':'input';
  el.addEventListener(ev, ()=>{ updateVals(); render(); saveState(); });
}
function updateVals(){
  $('nameSizeV').textContent=$('nameSize').value;
  $('widthV').textContent=$('width').value+'%';
  $('readSizeV').textContent=$('readSize').value;
  $('posYV').textContent=$('posY').value+'%';
  $('posY2V').textContent=$('posY2').value+'%';
  $('posXV').textContent=($('posX').value==0?'中央':$('posX').value);
  $('coverV').textContent=$('cover').value;
  $('ruleV').textContent=['なし','標準','長め'][$('rule').value];
}
// ---- center guide for 横位置 (snaps to center with a clear signal) ----
let guideTimer=null, wasCentered=true;
function showGuide(){
  const g=$('guide'), b=$('cbadge'), v=parseFloat($('posX').value);
  g.style.left = (50 + v) + '%';
  g.classList.add('on');
  const centered = (v===0);
  g.classList.toggle('centered', centered);
  b.classList.toggle('on', centered);
  clearTimeout(guideTimer);
  guideTimer = setTimeout(()=>{ g.classList.remove('on'); b.classList.remove('on'); }, 1500);
}
$('posX').addEventListener('input', ()=>{
  let v=parseFloat($('posX').value);
  if(Math.abs(v)<=1){ v=0; $('posX').value='0'; }          // snap to center
  const nowCentered=(v===0);
  if(nowCentered && !wasCentered && navigator.vibrate) navigator.vibrate(20); // buzz on iPhones that support it
  wasCentered=nowCentered;
  showGuide();
}, true);   // capture: run before the generic render handler

controls.forEach(bind);

// ---- save as JPEG ----
$('save').onclick = async ()=>{
  if(!img){ alert('先にテンプレート画像を選んでください'); return; }
  render();
  const name = ($('name').value.trim()||'plant-card').replace(/[^\w\- ]+/g,'').trim()||'plant-card';
  cv.toBlob(async blob=>{
    const file = new File([blob], name+'.jpg', {type:'image/jpeg'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file]}); return; }catch(e){ if(e.name==='AbortError') return; }
    }
    // fallback: download
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=name+'.jpg';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }, 'image/jpeg', 0.95);
};

// prevent pinch zoom
document.addEventListener('gesturestart', e=>e.preventDefault());

// ---- auto-update (so pushes actually reach the phone) ----
const APP_VERSION = "2";
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
fetch('version.json', {cache:'no-store'})
  .then(r=>r.json())
  .then(j=>{
    if(j && j.v && j.v!==APP_VERSION && !sessionStorage.getItem('rl_'+j.v)){
      sessionStorage.setItem('rl_'+j.v,'1'); location.reload();
    }
  }).catch(()=>{});

loadState();
updateVals();
</script>
</body>
</html>
